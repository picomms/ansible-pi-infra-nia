---
# =============================================================================
# CONNECTION & AUTHENTICATION
# =============================================================================
ansible_host: "{{ ssh_hosts.apple.ip }}"
ansible_user: "{{ ssh_hosts.apple.user }}"
ansible_connection: ssh
ansible_become_user: root
ansible_become_pass: "{{ ssh_hosts.apple.password }}"

# =============================================================================
# HOST IDENTIFICATION
# =============================================================================
hostname_hostname: apple
ansible_user_home: "/home/{{ ansible_user }}"

# =============================================================================
# SSH & SECURITY CONFIGURATION
# =============================================================================
# SSH settings for remote access and key management
security_ssh_password_authentication: "yes"
security_ssh_authorized_keys:
  - "{{ ssh_hosts.apple.ssh_public_key.public_key }}" # Allow apple access
security_ssh_private_key: "{{ ssh_hosts.apple.ssh_private_key.private_key }}"
security_ssh_public_key: "{{ ssh_hosts.apple.ssh_public_key.public_key }}"
security_sudoers_passwordless:
  - "{{ ansible_user }}"
  - "root"


# =============================================================================
# PACKAGE REPOSITORY CONFIGURATION
# =============================================================================
# Additional PPAs for graphics drivers and specialized software
apt_ppa_repos: []

# =============================================================================
# APT PACKAGE INSTALLATION
# =============================================================================
# Comprehensive package list for desktop development workstation
# Categories: Graphics/NVIDIA, Development, System Tools, Network, Media
apt_install:
  - ubuntu-drivers-common
  - build-essential
  - gcc
  - make
  - git
  - python3-venv
  - python3-pip
  - python3-dev
  - python3-setuptools
  - python3-full
  - gh
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg-agent
  - software-properties-common
  - p7zip-full
  - btop
  - zsh
  - just
  - nfs-common
  - cifs-utils
  - nfs-kernel-server

# =============================================================================
# GIT CONFIGURATION
# =============================================================================
# Development-focused Git settings for desktop workflow
git_user_name: "{{ git.user_name }}"
git_email: "{{ git.email }}" # Defined in vault/secrets.yml

git_settings:
  editor: "nano" # Lightweight editor for commits
  use_github_cli: true # Enable GitHub CLI integration
  github_cli_path: "/usr/bin/gh" # GitHub CLI binary location
  use_ssh: true # Prefer SSH for Git operations
  pull_rebase: false # Use merge strategy for pulls
  push_default: "simple" # Conservative push behavior
  auto_setup_remote: true # Automatically configure remotes

docker_users:
  - "{{ ansible_user }}" # Primary user Docker access
  - root # Administrative Docker access

user_paths:
  - "{{ ansible_user_home }}/code" # Source code repositories
  - "{{ ansible_user_home }}/projects" # Active project workspaces
  - "{{ ansible_user_home }}/media" # Media processing workspace
  - "{{ ansible_user_home }}/backups" # Backup storage root
  - "{{ ansible_user_home }}/backups/daily" # Daily backup rotation
  - "{{ ansible_user_home }}/backups/weekly" # Weekly backup retention
  - "{{ ansible_user_home }}/backups/monthly" # Monthly backup archives
