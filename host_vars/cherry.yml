---
# =============================================================================
# CONNECTION & AUTHENTICATION
# =============================================================================
ansible_host: "{{ ssh_hosts.cherry.ip }}"
ansible_user: "{{ ssh_hosts.cherry.user }}"
ansible_connection: ssh
ansible_become_user: root
ansible_become_pass: "{{ ssh_hosts.cherry.password }}"

# =============================================================================
# HOST IDENTIFICATION
# =============================================================================
hostname_hostname: cherry
ansible_user_home: "/home/{{ ansible_user }}"

# =============================================================================
# SSH & SECURITY CONFIGURATION
# =============================================================================
# SSH keys are managed manually on each host; Ansible does not deploy them.
security_ssh_password_authentication: "yes"
security_sudoers_passwordless:
  - "{{ ansible_user }}"
  - "root"


# =============================================================================
# PACKAGE REPOSITORY CONFIGURATION
# =============================================================================
# Additional PPAs for graphics drivers and specialized software
apt_ppa_repos: []

# =============================================================================
# APT PACKAGE INSTALLATION
# =============================================================================
# Comprehensive package list for desktop development workstation
# Categories: Graphics/NVIDIA, Development, System Tools, Network, Media
apt_install:
  - ubuntu-drivers-common
  - build-essential
  - gcc
  - make
  - git
  - python3-venv
  - python3-pip
  - python3-dev
  - python3-setuptools
  - python3-full
  - gh
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg-agent
  - software-properties-common
  - p7zip-full
  - btop
  - zsh
  - just
  - nfs-common
  - cifs-utils
  - nfs-kernel-server
  - chroma

docker_users:
  - "{{ ansible_user }}" # Primary user Docker access
  - root # Administrative Docker access

user_paths:
  - "{{ ansible_user_home }}/code" # Source code repositories
  - "{{ ansible_user_home }}/projects" # Active project workspaces
  - "{{ ansible_user_home }}/media" # Media processing workspace
  - "{{ ansible_user_home }}/backups" # Backup storage root
  - "{{ ansible_user_home }}/backups/daily" # Daily backup rotation
  - "{{ ansible_user_home }}/backups/weekly" # Weekly backup retention
  - "{{ ansible_user_home }}/backups/monthly" # Monthly backup archives

oh_my_zsh_theme: jispwoso
oh_my_zsh_update_mode: auto
users:
  - username: "{{ ansible_user }}"
    oh_my_zsh:
      theme: jispwoso
      update_mode: auto
      update_frequency: 7
      write_zshrc: true
  - username: "root"
    oh_my_zsh:
      theme: jispwoso
      update_mode: auto
      update_frequency: 7
      write_zshrc: true

oh_my_zsh_plugins:
  - aliases
  - ansible
  - colorize
  - common-aliases
  - docker
  - docker-compose
  - dotenv
  - git
  - github
  - history
  - python
  - uv
  - ssh
  - ubuntu
