---
# =============================================================================
# CONNECTION & AUTHENTICATION
# =============================================================================
ansible_host: "{{ ssh_hosts.knight0.ip }}"
ansible_user: "{{ ssh_hosts.knight0.user }}"
ansible_connection: ssh
ansible_become_user: root
ansible_become_pass: "{{ ssh_hosts.knight0.password }}"

# =============================================================================
# HOST IDENTIFICATION
# =============================================================================
hostname_hostname: knight0
ansible_user_home: "/home/{{ ansible_user }}"

# =============================================================================
# SSH & SECURITY CONFIGURATION
# =============================================================================
# SSH settings for remote access and key management
security_ssh_password_authentication: "yes"
security_ssh_authorized_keys:
  - "{{ ssh_hosts.castle0.ssh_public_key.public_key }}" # Allow knight0 access
security_ssh_private_key: "{{ ssh_hosts.knight0.ssh_private_key.private_key }}"
security_ssh_public_key: "{{ ssh_hosts.knight0.ssh_public_key.public_key }}"
security_sudoers_passwordless:
  - "{{ ansible_user }}"
  - "root"

# =============================================================================
# SHELL CUSTOMIZATION
# =============================================================================
# Custom aliases for development workflow efficiency
knight0_custom_aliases:
  - { alias: "dev", action: "cd ~/code" }
  - { alias: "projects", action: "cd ~/projects" }
  - { alias: "docker", action: "cd ~/docker" }

host_storage:
  usb_drives:
    - name: media
      uuid: 83872cf1-f155-4a1c-a6f4-a794397b5d27
      mount_point: /usb_media_storage
      fstype: ext4
      options: defaults,nofail,noatime,user
    - name: storage
      uuid: bad55df9-5e12-44d9-9045-6a2724392f6e
      mount_point: /usb_net_storage
      fstype: ext4
      options: defaults,nofail,noatime,user

nfs_exports:
  - "{{ (host_storage.usb_drives | selectattr('name', 'equalto', 'media') | list | first).mount_point }} *(rw,sync,no_root_squash,no_subtree_check)"
  - "{{ (host_storage.usb_drives | selectattr('name', 'equalto', 'storage') | list | first).mount_point }} *(rw,sync,no_root_squash,no_subtree_check)"

# =============================================================================
# PACKAGE REPOSITORY CONFIGURATION
# =============================================================================
# Additional PPAs for graphics drivers and specialized software
apt_ppa_repos: []

# =============================================================================
# APT PACKAGE INSTALLATION
# =============================================================================
# Comprehensive package list for desktop development workstation
# Categories: Graphics/NVIDIA, Development, System Tools, Network, Media
apt_install:
  - ubuntu-drivers-common

  # Development Tools & Compilers
  - build-essential
  - gcc
  - make
  - git
  - python3-venv
  - python3-pip
  - python3-dev
  - python3-setuptools
  - python3-full
  - gh # GitHub CLI

  # System Tools & Utilities
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg-agent
  - software-properties-common
  - p7zip-full
  - zip
  - hdparm # Disk utility
  - smartmontools # Drive health monitoring
  - iotop # I/O monitoring
  - rsync # File synchronization

  # Shell & Terminal Enhancements
  - zsh
  - zsh-syntax-highlighting
  - zsh-autosuggestions
  - zsh-common
  - zsh-doc

  # Document Processing & Publishing
  - texlive-full # Complete LaTeX distribution
  - pandoc # Document conversion

  # Network & Storage
  - wireguard # VPN solution
  - nfs-common # NFS client support
  - cifs-utils # SMB/CIFS client
  - nfs-kernel-server # NFS server (castle0 serves media)

# =============================================================================
# GIT CONFIGURATION
# =============================================================================
# Development-focused Git settings for desktop workflow
git_user_name: "{{ git.user_name }}"
git_email: "{{ git.email }}" # Defined in vault/secrets.yml

git_settings:
  editor: "nano" # Lightweight editor for commits
  use_github_cli: true # Enable GitHub CLI integration
  github_cli_path: "/usr/bin/gh" # GitHub CLI binary location
  use_ssh: true # Prefer SSH for Git operations
  pull_rebase: false # Use merge strategy for pulls
  push_default: "simple" # Conservative push behavior
  auto_setup_remote: true # Automatically configure remotes

# =============================================================================
# CONTAINER PLATFORM CONFIGURATION
# =============================================================================
# Docker user access for development containers
docker_users:
  - "{{ ansible_user }}" # Primary user Docker access
  - root # Administrative Docker access

# =================================================================================================
# =================================================================================================

# =============================================================================
# DEVELOPMENT WORKSPACE PATHS
# =============================================================================
# Directory structure for development and data organization
user_paths:
  - "{{ ansible_user_home }}/code" # Source code repositories
  - "{{ ansible_user_home }}/projects" # Active project workspaces
  - "{{ ansible_user_home }}/media" # Media processing workspace
  - "{{ ansible_user_home }}/backups" # Backup storage root
  - "{{ ansible_user_home }}/backups/daily" # Daily backup rotation
  - "{{ ansible_user_home }}/backups/weekly" # Weekly backup retention
  - "{{ ansible_user_home }}/backups/monthly" # Monthly backup archives
